version: 1
interactions:
- request:
    method: POST
    uri: https://api.openai.com/v1/chat/completions
    headers:
      host:
      - api.openai.com
      accept:
      - '*/*'
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      accept-encoding:
      - identity
      content-type:
      - application/json
    parsed_body:
      model: recorded-invalid-chat-model
      messages:
      - role: user
        content: 'Reply with exactly: Hello, recorded Chat!'
      max_completion_tokens: 256
      reasoning_effort: minimal
      store: false
      n: 1
      stream: false
  response:
    status:
      code: 404
      message: Not Found
    headers:
      content-type:
      - application/json; charset=utf-8
      connection:
      - keep-alive
      server:
      - cloudflare
      strict-transport-security:
      - max-age=31536000; includeSubDomains; preload
      vary:
      - Origin
      access-control-expose-headers:
      - CF-Ray
      - CF-Ray
      alt-svc:
      - h3=":443"; ma=86400
    body:
      parsed_body:
        error:
          message: The model `recorded-invalid-chat-model` does not exist or you do not have access to it.
          type: invalid_request_error
          param: null
          code: model_not_found
