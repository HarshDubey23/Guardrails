version: 1
interactions:
- request:
    method: POST
    uri: https://inference-api.nvidia.com/v1/responses
    headers:
      host:
      - inference-api.nvidia.com
      accept:
      - '*/*'
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      accept-encoding:
      - identity
      content-type:
      - application/json
    parsed_body:
      model: openai/openai/gpt-5-nano
      input: 'Reply with exactly: Hello.'
      stream: false
      store: false
      max_output_tokens: 256
      reasoning:
        effort: minimal
  response:
    status:
      code: 200
      message: OK
    headers:
      content-type:
      - application/json
      content-security-policy:
      - frame-ancestors 'none'
      vary:
      - Accept-Encoding
    body:
      parsed_body:
        id: '[RECORDED_RESPONSE_ID]'
        created_at: 0
        error: null
        incomplete_details: null
        instructions: null
        metadata: {}
        model: openai/openai/gpt-5-nano
        object: response
        output:
        - id: recorded_id_1
          summary: []
          type: reasoning
          content: []
          encrypted_content: '[REDACTED_ENCRYPTED_CONTENT]'
        - id: recorded_id_2
          content:
          - annotations: []
            text: Hello.
            type: output_text
            logprobs: []
          role: assistant
          status: completed
          type: message
          phase: null
        parallel_tool_calls: true
        temperature: 1.0
        tool_choice: auto
        tools: []
        top_p: 1.0
        max_output_tokens: 256
        previous_response_id: null
        reasoning:
          context: current_turn
          effort: minimal
          mode: standard
          summary: null
        status: completed
        text:
          format:
            type: text
          verbosity: medium
        truncation: disabled
        usage:
